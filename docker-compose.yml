services:
  postgres:
    image: postgres:16
    container_name: eadp-postgres
    environment:
      POSTGRES_DB: eadp
      POSTGRES_USER: eadp_user
      POSTGRES_PASSWORD: eadp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: