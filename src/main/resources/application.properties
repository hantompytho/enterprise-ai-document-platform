spring.application.name=enterprise-ai-document-platform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eadp}
spring.datasource.username=${DB_USERNAME:eadp_user}
spring.datasource.password=${DB_PASSWORD:eadp_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000s